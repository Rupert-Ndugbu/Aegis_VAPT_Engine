version: '3.8'

services:
  aegis:
    build: .
    container_name: aegis_vapt
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=aegis_admin
      - DB_PASS=securepassword
      - DB_NAME=aegis_vapt
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:15
    container_name: aegis_db
    environment:
      - POSTGRES_USER=aegis_admin
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=aegis_vapt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
