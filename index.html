<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS VAPT ENGINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 flex flex-col items-center justify-center">

    <h1 class="text-3xl font-extrabold text-blue-500 text-center mb-8">AEGIS VAPT ENGINE</h1>

    <div id="login_card" class="bg-gray-900 p-8 rounded-xl border border-blue-500 shadow-xl w-full max-w-md">
        <h2 class="text-xl text-slate-200 mb-6 text-center">System Authentication</h2>
        
        <div class="mb-4">
            <input type="text" id="username" placeholder="User ID" class="bg-gray-800 p-3 w-full rounded border border-gray-700 outline-none focus:border-blue-500">
        </div>

        <div class="mb-6 relative">
            <input type="password" id="password" placeholder="Password" class="bg-gray-800 p-3 w-full rounded border border-gray-700 outline-none focus:border-blue-500">
            <button type="button" id="toggleBtn" onclick="togglePassword()" class="absolute right-3 top-3 text-xs text-blue-400 hover:text-blue-300">Show</button>
        </div>

        <button type="button" onclick="authenticate()" class="bg-blue-600 hover:bg-blue-500 w-full py-3 rounded font-bold transition">LOGIN</button>
    </div>

    <div id="scan_card" class="hidden bg-gray-900 p-8 rounded-xl border border-green-500 shadow-xl w-full max-w-2xl">
        <div class="text-green-400 font-semibold mb-4">Scanner Ready</div>
        
        <div class="mb-4">
            <input type="text" id="target" placeholder="Enter Target IP Address" class="bg-gray-800 p-3 w-full rounded border border-gray-700 outline-none focus:border-green-500">
        </div>

        <div class="mb-4 grid grid-cols-2 gap-4">
            <select id="scan_mode" onchange="toggleCustomPorts()" class="bg-gray-800 p-3 rounded border border-gray-700 outline-none text-white">
                <option value="1-1000">Quick Scan (Top 1000)</option>
                <option value="1-65535">Full Scan (All Ports)</option>
                <option value="custom">Custom Ports</option>
            </select>
            
            <input type="text" id="custom_ports" placeholder="e.g. 80,443" class="bg-gray-800 p-3 rounded border border-gray-700 hidden outline-none focus:border-green-500">
        </div>

        <button type="button" onclick="startScan()" class="bg-red-600 hover:bg-red-500 w-full py-3 rounded font-bold transition">SCAN</button>
        
        <div id="loader" class="hidden mt-4 text-center text-yellow-400 font-semibold animate-pulse">
            Processing... Aegis is analyzing the target. Please wait.
        </div>
    </div>

    <div id="results_table" class="hidden mt-6 bg-gray-900 p-6 rounded-xl border border-gray-800 w-full max-w-2xl">
        <h2 class="text-lg font-bold text-blue-400 mb-4">Vulnerability Findings</h2>
        <div id="results_content" class="space-y-2"></div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('toggleBtn');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        }

        function toggleCustomPorts() {
            const scanMode = document.getElementById('scan_mode').value;
            const customPortsInput = document.getElementById('custom_ports');
            if (scanMode === 'custom') {
                customPortsInput.classList.remove('hidden');
            } else {
                customPortsInput.classList.add('hidden');
            }
        }

        async function authenticate() {
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            if (!usernameInput || !passwordInput) {
                alert('Please enter both User ID and Password.');
                return;
            }
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });
                if (response.ok) {
                    document.getElementById('login_card').classList.add('hidden');
                    document.getElementById('scan_card').classList.remove('hidden');
                } else {
                    alert('Authentication failed.');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Could not connect to backend server.');
            }
        }

        async function startScan() {
            const targetIp = document.getElementById('target').value.trim();
            const scanMode = document.getElementById('scan_mode').value;
            let portRange = scanMode;
            if (scanMode === 'custom') {
                portRange = document.getElementById('custom_ports').value.trim();
            }
            if (!targetIp) {
                alert('Please enter a target IP address.');
                return;
            }
            document.getElementById('loader').classList.remove('hidden');
            const resultsTable = document.getElementById('results_table');
            const resultsContent = document.getElementById('results_content');
            resultsTable.classList.add('hidden');
            resultsContent.innerHTML = '';

            try {
                const formData = new URLSearchParams();
                formData.append('target', targetIp);
                formData.append('ports', portRange);

                const response = await fetch('http://127.0.0.1:8000/api/v1/scan', {
                    method: 'POST',
                    body: formData
                });
                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    throw new Error("Server response contains non-JSON data.");
                }

                document.getElementById('loader').classList.add('hidden');
                resultsTable.classList.remove('hidden');

                if (Array.isArray(data)) {
                    data.forEach(item => {
                        const row = document.createElement('div');
                        row.className = 'bg-gray-950 p-3 rounded border border-gray-800 text-sm flex justify-between items-center';
                        row.innerHTML = <span class="text-cyan-400 font-bold">Port ${item.port}</span> <span>State: <strong class="text-green-400">${item.state}</strong></span> <span>Verdict: ${item.verdict || 'N/A'}</span>;
                        resultsContent.appendChild(row);
                    });
                } else {
                    resultsContent.innerHTML = '<pre class="text-xs text-slate-300">${JSON.stringify(data, null, 2)}</pre>';
                }
            } catch (error) {
                document.getElementById('loader').classList.add('hidden');
                console.error("Scan failed:", error);
                alert('Scan request failed. Please check the backend logs.');
            }
        }
    </script>
</body>
</html>
